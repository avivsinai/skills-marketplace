name: AI Plugin Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ai-plugin-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: AI plugin scanner
        uses: hashgraph-online/ai-plugin-scanner-action@d54b5d50c5c11c069aca137f71a75d5582d776b6 # v1
        with:
          plugin_dir: "."
