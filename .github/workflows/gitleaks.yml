name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read
  security-events: write
  actions: read

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        uses: DariuszPorowski/github-action-gitleaks@a027585cb1f2780aa441f20f4d0aabf8b1a0d90e # v2
        with:
          config: .gitleaks.toml
          report_format: sarif
          fail: false
          log_level: info

      - name: Upload SARIF to GitHub Code Scanning
        if: steps.gitleaks.outputs.exitcode == 1
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v3
        with:
          sarif_file: ${{ steps.gitleaks.outputs.report }}

      - name: Fail if secrets found
        if: steps.gitleaks.outputs.exitcode == 1
        run: |
          echo "::error::Gitleaks detected secrets in the codebase"
          exit 1
