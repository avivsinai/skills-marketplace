name: Validate Marketplace

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/marketplace.json'
      - '.agents/plugins/marketplace.json'
      - 'registry/**'
      - 'plugins/**'
      - 'scripts/**'
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate registry syntax
        run: python3 -m json.tool registry/plugins.json > /dev/null

      - name: Validate CC marketplace syntax
        run: python3 -m json.tool .claude-plugin/marketplace.json > /dev/null

      - name: Validate Codex marketplace syntax
        run: python3 -m json.tool .agents/plugins/marketplace.json > /dev/null

      - name: Validate registry structure
        run: |
          python3 - <<'EOF'
          import json
          import sys

          with open('registry/plugins.json') as f:
              data = json.load(f)

          # Check required top-level fields
          for field in ['name', 'owner', 'metadata', 'interface', 'plugins']:
              if field not in data:
                  print(f"Registry missing required field: {field}")
                  sys.exit(1)

          if 'name' not in data.get('owner', {}):
              print("owner.name is required")
              sys.exit(1)

          if 'displayName' not in data.get('interface', {}):
              print("interface.displayName is required")
              sys.exit(1)

          # Check each plugin entry
          for plugin in data.get('plugins', []):
              name = plugin.get('name', '<unnamed>')
              for field in ['name', 'description', 'repository', 'version', 'ref', 'keywords', 'category', 'policy', 'sync']:
                  if field not in plugin:
                      print(f"Plugin '{name}' missing required field: {field}")
                      sys.exit(1)
              policy = plugin.get('policy', {})
              for field in ['installation', 'authentication']:
                  if field not in policy:
                      print(f"Plugin '{name}' policy missing: {field}")
                      sys.exit(1)
              sync = plugin.get('sync', {})
              if sync.get('mode') not in {'release', 'manual'}:
                  print(f"Plugin '{name}' sync.mode must be 'release' or 'manual'")
                  sys.exit(1)
              if sync.get('mode') == 'release' and not isinstance(sync.get('prereleases'), bool):
                  print(f"Plugin '{name}' release sync requires boolean prereleases")
                  sys.exit(1)

          print(f"Registry validated: {len(data['plugins'])} plugins")
          EOF

      - name: Validate CC marketplace structure
        run: |
          python3 - <<'EOF'
          import json
          import sys

          with open('.claude-plugin/marketplace.json') as f:
              data = json.load(f)

          for field in ['name', 'owner', 'plugins']:
              if field not in data:
                  print(f"CC manifest missing: {field}")
                  sys.exit(1)

          for plugin in data.get('plugins', []):
              if 'name' not in plugin or 'source' not in plugin or 'version' not in plugin:
                  print(f"CC plugin missing name/source/version: {plugin}")
                  sys.exit(1)
              source = plugin.get('source')
              if isinstance(source, dict):
                  source_type = source.get('source')
                  if source_type == 'github':
                      if 'repo' not in source:
                          print(f"CC plugin '{plugin['name']}' github source missing repo")
                          sys.exit(1)
                      if 'ref' not in source and 'sha' not in source:
                          print(f"CC plugin '{plugin['name']}' github source must pin ref or sha")
                          sys.exit(1)

          print(f"CC manifest validated: {len(data['plugins'])} plugins")
          EOF

      - name: Validate Codex marketplace structure
        run: |
          python3 - <<'EOF'
          import json
          import sys

          with open('.agents/plugins/marketplace.json') as f:
              data = json.load(f)

          if 'interface' not in data:
              print("Codex manifest missing interface block")
              sys.exit(1)

          for plugin in data.get('plugins', []):
              name = plugin.get('name', '<unnamed>')
              source = plugin.get('source', {})
              if source.get('source') != 'local':
                  print(f"Codex plugin '{name}' must use source: local")
                  sys.exit(1)
              if 'path' not in source:
                  print(f"Codex plugin '{name}' missing source.path")
                  sys.exit(1)
              if 'policy' not in plugin:
                  print(f"Codex plugin '{name}' missing policy")
                  sys.exit(1)
              if 'category' not in plugin:
                  print(f"Codex plugin '{name}' missing category")
                  sys.exit(1)

          print(f"Codex manifest validated: {len(data['plugins'])} plugins")
          EOF

      - name: Check Codex bundles have required files
        run: |
          for dir in plugins/*/; do
            name=$(basename "$dir")
            if [ ! -f "${dir}.codex-plugin/plugin.json" ]; then
              echo "Missing .codex-plugin/plugin.json in ${dir}"
              exit 1
            fi
            found_skill=false
            for skill_dir in ${dir}skills/*/; do
              if [ -f "${skill_dir}SKILL.md" ]; then
                found_skill=true
              fi
            done
            if [ "$found_skill" = false ]; then
              echo "No skills with SKILL.md found in ${dir}"
              exit 1
            fi
          done
          echo "All Codex bundles have required files"

      - name: Drift check — regenerate and verify
        run: |
          python3 scripts/generate-manifests.py
          if ! git diff --exit-code -- .claude-plugin/marketplace.json .agents/plugins/marketplace.json plugins/; then
            echo "Generated output drifted from registry! Run: python3 scripts/generate-manifests.py"
            exit 1
          fi
          echo "No drift detected"
