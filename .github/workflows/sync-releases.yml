name: Sync Marketplace Pins

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Optional owner/name repo slug to sync
        required: false
        type: string
  repository_dispatch:
    types:
      - plugin-update
      - plugin-release
      - sync-marketplace

concurrency:
  group: sync-marketplace-releases
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      TARGET_REPO: ${{ github.event.client_payload.repo || inputs.repo || '' }}
    steps:
      - name: Detect release App key
        id: app-key
        env:
          KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Mint sync token
        id: sync-token
        if: vars.RELEASE_APP_CLIENT_ID != '' && steps.app-key.outputs.present == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Source repos can be private (israel-services), which the built-in
      # GITHUB_TOKEN cannot read. A read-only App token over the whole
      # installation lets the sync scripts read them.
      - name: Mint source read token
        id: read-token
        if: vars.RELEASE_APP_CLIENT_ID != '' && steps.app-key.outputs.present == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.sync-token.outputs.token || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Sync main-mode plugins
        env:
          GITHUB_TOKEN: ${{ steps.read-token.outputs.token || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          args=()
          if [ -n "$TARGET_REPO" ]; then
            args+=(--repo "$TARGET_REPO")
          fi
          python3 scripts/sync-releases.py "${args[@]}"

      - name: Regenerate marketplace manifests
        env:
          GITHUB_TOKEN: ${{ steps.read-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate-manifests.py

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- registry/plugins.json .claude-plugin/marketplace.json .agents/plugins/marketplace.json plugins/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit synced marketplace
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.sync-token.outputs.token || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/plugins.json .claude-plugin/marketplace.json .agents/plugins/marketplace.json plugins/
          if [ -n "$TARGET_REPO" ]; then
            commit_message="chore: sync marketplace for $TARGET_REPO"
          else
            commit_message="chore: sync marketplace pins"
          fi
          git commit -m "$commit_message"
          branch="sync/marketplace-$(date -u +%Y%m%d%H%M%S)"
          git push origin "HEAD:$branch"
          gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title "$commit_message" --body "Automated marketplace pin sync." || {
            # A sync PR may already be open — force-push the update onto it.
            existing=$(gh pr list --head "$branch" --json number --jq '.[0].number')
            echo "PR already exists: #$existing"
          }
          pr=$(gh pr list --head "$branch" --json number --jq '.[0].number')
          gh pr merge "$pr" --squash --auto --delete-branch
