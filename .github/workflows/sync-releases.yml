name: Sync Marketplace Pins

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Optional owner/name repo slug to sync
        required: false
        type: string
  repository_dispatch:
    types:
      - plugin-update
      - plugin-release
      - sync-marketplace

concurrency:
  group: sync-marketplace-releases
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      TARGET_REPO: ${{ github.event.client_payload.repo || inputs.repo || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.MARKETPLACE_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Sync main-mode plugins
        env:
          GITHUB_TOKEN: ${{ secrets.MARKETPLACE_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          args=()
          if [ -n "$TARGET_REPO" ]; then
            args+=(--repo "$TARGET_REPO")
          fi
          python3 scripts/sync-releases.py "${args[@]}"

      - name: Regenerate marketplace manifests
        env:
          GITHUB_TOKEN: ${{ secrets.MARKETPLACE_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate-manifests.py

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- registry/plugins.json .claude-plugin/marketplace.json .agents/plugins/marketplace.json plugins/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit synced marketplace
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/plugins.json .claude-plugin/marketplace.json .agents/plugins/marketplace.json plugins/
          if [ -n "$TARGET_REPO" ]; then
            commit_message="chore: sync marketplace for $TARGET_REPO"
          else
            commit_message="chore: sync marketplace pins"
          fi
          git commit -m "$commit_message"
          git push origin "HEAD:$DEFAULT_BRANCH"
